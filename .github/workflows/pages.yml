          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add',*changes.keys(),'RESEARCH_SOURCES_APPLIED'],check=True)
          subprocess.run(['git','commit','-m','Add separate tennis research sources and source tracking'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
      - name: Validate application
        run: |
          npm run check
          npm test
      - uses: actions/configure-pages@v5
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html styles.css app.js engine.js data.js store.js sources.js sw.js manifest.webmanifest icon.svg icon-192.png icon-512.png SETUP.md _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
