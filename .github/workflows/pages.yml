          for name, data in files.items():
              p = pathlib.Path(name)
              assert not p.is_absolute() and '..' not in p.parts and '.github' not in p.parts
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(base64.b64decode(data))
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','.'],check=True)
          subprocess.run(['git','commit','-m','Build Edgeboard live sports workspace and private ledger'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate application
        run: |
          npm run check
          npm test
      - uses: actions/configure-pages@v5
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html styles.css app.js engine.js data.js store.js sw.js manifest.webmanifest icon.svg icon-192.png icon-512.png SETUP.md _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
