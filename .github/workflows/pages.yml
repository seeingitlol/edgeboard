              if not path.exists():
                  if item['base'] is not None: raise RuntimeError('Expected file missing: '+name)
                  continue
              current=path.read_bytes()
              sha=hashlib.sha1(b'blob '+str(len(current)).encode()+b'\0'+current).hexdigest()
              if current!=item['content'].encode() and sha!=item['base']:
                  raise RuntimeError('File changed since preparation; review before applying: '+name)
          for name,item in changes.items():
              pathlib.Path(name).write_text(item['content'])
          subprocess.run(['npm','run','check'],check=True)
          subprocess.run(['npm','test'],check=True)
          pathlib.Path('RESEARCH_SOURCES_APPLIED').write_text('Separate research links, source attribution and ticket filtering.\n')
