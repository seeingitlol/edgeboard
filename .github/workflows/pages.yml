          """
          changes = json.loads(gzip.decompress(base64.b64decode(payload)))
          def gitsha(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          # Validate every base before changing any file. Stop if unrelated edits intervened.
          for name, item in changes.items():
              p = pathlib.Path(name)
              assert not p.is_absolute() and '..' not in p.parts and '.github' not in p.parts
              current = p.read_bytes() if p.exists() else None
              target = item['content'].encode()
              if current == target:
                  continue
              actual = gitsha(current) if current is not None else None
              if actual != item['base']:
                  raise RuntimeError('File changed since this fix was prepared: '+name)
          for name, item in changes.items():
              p = pathlib.Path(name)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(item['content'])
          pathlib.Path('MARKET_FIX_V2_APPLIED').write_text('Tennis awaiting-start handling, complete candidate search, scan synchronization and explicit diagnostics.\n')
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add',*changes.keys(),'MARKET_FIX_V2_APPLIED'],check=True)
          subprocess.run(['git','commit','-m','Fix missing awaiting-start tennis markets and combo generation'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate application
        run: |
          npm run check
          npm test
      - uses: actions/configure-pages@v5
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html styles.css app.js engine.js data.js store.js sw.js manifest.webmanifest icon.svg icon-192.png icon-512.png SETUP.md _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
